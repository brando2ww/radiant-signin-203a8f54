project_id = "frbziqazwhymwsrtneoy"

[functions.focusnfe-webhook-receiver]
verify_jwt = false

[functions.focusnfe-dfe-diag]
verify_jwt = false

# Rotas abertas: são chamadas direto pelo navegador/WhatsApp, sem chave. Ficar
# aqui evita a regressão de 02/09/2026, quando um deploy sem --no-verify-jwt
# devolveu 401 para todo fornecedor que tocou no botão.
[functions.og-cotacao]
verify_jwt = false

[functions.og-pedido]
verify_jwt = false

# O colaborador bate ponto sem login (entra por link com senha), então a função
# da selfie não pode exigir JWT. A trava é o token de sessão, conferido no banco.
[functions.ponto-selfie]
verify_jwt = false

# Força de vendas: o Asaas avisa os pagamentos sem login. A trava é o token do
# estabelecimento na URL + o header asaas-access-token, conferidos na função.
# (No self-hosted o VERIFY_JWT é global e desligado; isto vale para a nuvem.)
[functions.vendas-asaas-webhook]
verify_jwt = false
