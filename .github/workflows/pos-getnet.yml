# Compila o APK do terminal Getnet na nuvem.
#
# Aqui não há Android SDK nem Java na máquina do dia a dia, e o disco é curto:
# o runner do GitHub já vem com tudo. O APK sai como artefato, pronto para
# subir no Portal do Desenvolvedor da Getnet.
name: APK da maquininha Getnet

on:
  workflow_dispatch:
  push:
    branches: [pos-getnet]
    paths:
      - "pos-getnet/**"
      - ".github/workflows/pos-getnet.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner já traz o SDK do Android. A ação setup-android tenta instalar o
      # pacote "tools", que o Google descontinuou, e morre com exit 1.
      - name: SDK do Android
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          GERENTE=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $GERENTE"
          yes | "$GERENTE" --licenses > /dev/null 2>&1 || true
          "$GERENTE" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          ls "$SDK/platforms" "$SDK/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Chave de assinatura
        env:
          CHAVE_B64: ${{ secrets.KEYSTORE_B64 }}
          SENHA: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/chave"
          SENHA="${SENHA:-velara-pos-getnet}"
          echo "SENHA_CHAVE=$SENHA" >> "$GITHUB_ENV"
          # A GetStore só aceita atualização assinada com a MESMA chave do app
          # já enviado (a do 2.0.1). Sem o segredo, parar; gerar chave nova
          # produziria um APK que a Getnet recusa.
          if [ -z "$CHAVE_B64" ]; then
            echo "::error::Segredo KEYSTORE_B64 ausente. Cadastre a chave do app antes de compilar."
            exit 1
          fi
          echo "$CHAVE_B64" | base64 -d > "$RUNNER_TEMP/chave/velara.jks"
          echo "GERADA=nao" >> "$GITHUB_ENV"
          echo "Usando a chave guardada no segredo do repositório."

      - name: Compilar
        working-directory: pos-getnet
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/chave/velara.jks
          KEYSTORE_PASSWORD: ${{ env.SENHA_CHAVE }}
          KEY_ALIAS: velara
          KEY_PASSWORD: ${{ env.SENHA_CHAVE }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Conferir o pacote
        run: |
          set -e
          APK=$(find pos-getnet/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -la "$APK"
          FERRAMENTAS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "== identidade =="
          "$FERRAMENTAS/aapt2" dump badging "$APK" | grep -E "^package|^application-label|^launchable-activity|uses-permission|sdkVersion|targetSdkVersion"
          echo "== assinatura =="
          "$FERRAMENTAS/apksigner" verify --verbose --print-certs "$APK"
          # Impressão digital do certificado do 2.0.1, a versão que está na GetStore.
          ESPERADA="7285d2821c08a6dccc89d8286c7c5a5b704c8a65ce5c1115760da796c94caffa"
          ACHADA=$("$FERRAMENTAS/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "certificado: $ACHADA"
          if [ "$ACHADA" != "$ESPERADA" ]; then
            echo "::error::APK assinado com chave diferente da enviada à Getnet."
            exit 1
          fi
          echo "APK_CAMINHO=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: velara-pos-getnet-apk
          path: ${{ env.APK_CAMINHO }}
          if-no-files-found: error

      - name: Guardar a chave quando ela é nova
        if: env.GERADA == 'sim'
        run: |
          base64 -w0 "$RUNNER_TEMP/chave/velara.jks" > "$RUNNER_TEMP/chave/velara.jks.base64.txt"
          echo "Guarde este arquivo em local seguro e cadastre como segredo KEYSTORE_B64." > "$RUNNER_TEMP/chave/LEIA-ME.txt"
          echo "Senha usada: $SENHA_CHAVE (cadastre como KEYSTORE_PASSWORD)" >> "$RUNNER_TEMP/chave/LEIA-ME.txt"

      - uses: actions/upload-artifact@v4
        if: env.GERADA == 'sim'
        with:
          name: chave-de-assinatura
          path: |
            ${{ runner.temp }}/chave/velara.jks
            ${{ runner.temp }}/chave/velara.jks.base64.txt
            ${{ runner.temp }}/chave/LEIA-ME.txt
